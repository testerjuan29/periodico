# ==============================================================================
# PRODUCCIÓN REAL (cliente con WordPress propio — paginauno.do)
#
#   docker compose -f docker-compose.produccion.yml up -d --build
#
# Diferencias vs docker-compose.prod.yml (el de SQA/demo):
#   - SIN WordPress demo (wordpress + wp_db no existen): se publica en el WP
#     real del cliente vía WP_URL + WP_APP_USER + WP_APP_PASSWORD (.env)
#   - Caddyfile.produccion: solo 2 dominios (panel y n8n)
#   - 5 contenedores: caddy, postgres, n8n, backoffice, image-renderer
#
# Requiere en el .env:
#   BACKOFFICE_DOMAIN=panel.paginauno.do
#   N8N_DOMAIN=n8n.paginauno.do        (o sslip.io mientras no haya DNS)
#   WP_URL=https://paginauno.do
#   WP_APP_USER=automatizacion         (usuario rol Editor en el WP del cliente)
#   WP_APP_PASSWORD=<application password generada en ese WP>
#   + los secretos de siempre (ver .env.example)
# ==============================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: pa_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      BACKOFFICE_DOMAIN: ${BACKOFFICE_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
    volumes:
      - ./deploy/Caddyfile.produccion:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pa_net

  postgres:
    image: postgres:16-alpine
    container_name: pa_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pa_net

  n8n:
    image: n8nio/n8n:latest
    container_name: pa_n8n
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # WordPress REAL del cliente
      WP_INTERNAL_URL: ${WP_URL}
      WP_APP_USER: ${WP_APP_USER}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      WA_MEDIA_DOWNLOAD_ENABLED: ${WA_MEDIA_DOWNLOAD_ENABLED:-false}
      BACKOFFICE_PUBLIC_URL: https://${BACKOFFICE_DOMAIN}
      META_PAGE_ID: ${META_PAGE_ID}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN}
      META_IG_USER_ID: ${META_IG_USER_ID}
      IMGBB_API_KEY: ${IMGBB_API_KEY}
      IMAGE_RENDERER_URL: http://image-renderer:3001
      BACKOFFICE_INTERNAL_URL: http://backoffice:3000
      UPLOAD_TOKEN: ${UPLOAD_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./templates:/templates:ro
    networks:
      - pa_net

  image-renderer:
    build:
      context: .
      dockerfile: image-renderer/Dockerfile
    container_name: pa_image_renderer
    restart: always
    environment:
      PORT: 3001
      TEMPLATES_DIR: /templates
      OUTPUT_DIR: /output
    volumes:
      - ./templates:/templates:ro
      - image_output:/output
    networks:
      - pa_net

  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
    container_name: pa_backoffice
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEXTAUTH_URL: https://${BACKOFFICE_DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USER: ${ADMIN_USER:-editor}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      N8N_APPROVAL_WEBHOOK: http://n8n:5678/webhook/publication-approved
      N8N_GENERATE_WEBHOOK: http://n8n:5678/webhook/generate-content
      UPLOADS_MOUNT: /uploads
      IMAGE_RENDERER_URL: http://image-renderer:3001
      BACKOFFICE_INTERNAL_URL: http://backoffice:3000
      UPLOAD_TOKEN: ${UPLOAD_TOKEN}
      # URL pública del WP real — dominio y placeholders de enlaces en la UI
      WP_PUBLIC_URL: ${WP_URL}
    volumes:
      - uploads:/uploads
    networks:
      - pa_net

volumes:
  postgres_data:
  n8n_data:
  image_output:
  uploads:
  caddy_data:
  caddy_config:

networks:
  pa_net:
    driver: bridge
